<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="careGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1428A0" />
      <stop offset="100%" stop-color="#0055DF" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#0066FF" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0A144E" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Base with subtle border -->
  <rect width="512" height="512" rx="112" fill="url(#careGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="4" />

  <!-- Abstract Road / Mobility Arc -->
  <path d="M 64 390 C 180 340, 332 340, 448 390" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="12" stroke-linecap="round" />
  <path d="M 120 410 C 200 375, 312 375, 392 410" fill="none" stroke="rgba(0,229,255,0.4)" stroke-width="6" stroke-linecap="round" />

  <!-- Stylized Modern Car Silhouette -->
  <g filter="url(#shadow)" transform="translate(0, -10)">
    <!-- Car Body -->
    <path d="M 120 280 
             L 155 205 
             C 170 175, 205 160, 256 160 
             C 307 160, 342 175, 357 205 
             L 392 280 
             C 416 288, 428 308, 428 334 
             C 428 360, 408 376, 384 376 
             L 128 376 
             C 104 376, 84 360, 84 334 
             C 84 308, 96 288, 120 280 Z" 
          fill="#FFFFFF" />

    <!-- Windshield -->
    <path d="M 168 215 
             C 178 190, 204 180, 256 180 
             C 308 180, 334 190, 344 215 
             L 366 265 
             L 146 265 Z" 
          fill="#0F172A" />

    <!-- Headlights -->
    <rect x="110" y="295" width="48" height="16" rx="8" fill="url(#accentGrad)" />
    <rect x="354" y="295" width="48" height="16" rx="8" fill="url(#accentGrad)" />

    <!-- Front Grille Lightbar -->
    <line x1="185" y1="303" x2="327" y2="303" stroke="rgba(20,40,160,0.2)" stroke-width="6" stroke-linecap="round" />

    <!-- Wheels Base -->
    <rect x="120" y="364" width="60" height="20" rx="10" fill="#0A0F1D" />
    <rect x="332" y="364" width="60" height="20" rx="10" fill="#0A0F1D" />
  </g>

  <!-- Electric Spark Badge / Top Right -->
  <g transform="translate(370, 75)">
    <circle cx="28" cy="28" r="38" fill="url(#accentGrad)" filter="url(#shadow)" />
    <!-- Flash bolt -->
    <path d="M 32 6 L 16 30 L 28 30 L 22 50 L 42 24 L 30 24 Z" fill="#0A144E" />
  </g>

  <!-- Typography Brand at bottom -->
  <text x="256" y="460" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" fill="#FFFFFF" letter-spacing="4">CARE</text>
</svg>
